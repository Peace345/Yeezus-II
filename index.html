<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Yeezus II</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #111;
      color: white;
      text-align: center;
    }

    #player {
      padding: 20px;
    }

    #cover {
      width: 250px;
      height: 250px;
      object-fit: cover;
      margin-top: 10px;
      border-radius: 10px;
    }

    .song {
      padding: 10px;
      margin: 5px auto;
      width: 60%;
      background: #222;
      cursor: pointer;
      border-radius: 5px;
    }

    .song:hover {
      background: #333;
    }

    button {
      margin: 10px;
      padding: 10px 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="player">

  <!-- BACK BUTTON -->
  <button onclick="goBack()">⬅ Back to Library</button>

  <!-- ALBUM INFO -->
  <h1 id="albumTitle">Yeezus II</h1>
  <img id="cover" src="" alt="cover">

  <!-- SONG LIST -->
  <div id="songs"></div>

</div>

<audio id="audio"></audio>

<button id="playPauseBtn" onclick="togglePlay()">▶️ Play</button>

<script>

let currentAlbum = {
  name: "Yeezus II",
  cover: "yeezusiicover.jpeg",
  songs: [
      { file: "theworld.mp3", title: "The World", artist: "Kanye West, Bon Iver" },
      { file: "pissonyourgrave.mp3", title: "Piss On Your Grave", artist: "Kanye West, Travis Scott" },
      { file: "falloutofheaven.mp3", title: "Fall Out Of Heaven", artist: "Kanye West, Bon Iver, The-Dream" },
      { file: "newangels.mp3", title: "New Angels", artist: "Kanye West"},
      { file: "youaintnomodel.mp3", title: "You Ain't No Models", artist: "Kanye West, Livvi Franc" },
      { file: "ninachop.mp3", title: "Nina Chop", artist: "Kanye West, Swizz Beatz, Young Thug" },
      { file: "godlevel.mp3", title: "God Level", artist: "Kanye West, CyHi the Prynce" },
      { file: "ultimatelie.mp3", title: "Ultimate Lie", artist: "Kanye West"},
      { file: "tomcruise.mp3", title: "Tom Cruise", artist: "Kanye West"},
      { file: "mrsmisery.mp3", title: "Mrs. Misery", artist: "Kanye West, John Legend" },
      { file: "wheniseeit.mp3", title: "When I See It", artist: "Kanye West, The Weeknd" },
      { file: "afteryou.mp3", title: "After You", artist: "Kanye West, John Legend, Pusha T, Sia" },
      { file: "neverletmego.mp3", title: "Never Let Me Go", artist: "Kanye West" },
      { file: "hummer.mp3", title: "HUMMER", artist: "Kanye West, A$AP Rocky, MovaKween" },
      { file: "nevertriedthis.mp3", title: "Never Tried This", artist: "Kanye West, CyHi the Prynce" },
      { file: "sanctified.mp3", title: "Sanctified", artist: "Kanye West, Rick Ross, Big Sean" },
      {
        title: "Special",
        versions: [
          {
            version: "V4",
            file: "specialv4.mp3",
            artist: "Kanye West, Travis Scott, Rihanna"
          },
          {
            version: "V1",
            file: "special.mp3",
            artist: "Kanye West"
          },
        ]
      },
      { file: "abouttime.mp3", title: "About Time", artist: "Kanye West" },
      { file: "ibeentrill.mp3", title: "I Been Trill", artist: "Kanye West, Travis Scott, Treated Crew" },
      { file: "depictionofthedevil.mp3", title: "Depiction of the Devil", artist: "Kanye West, Kirby Lauryen" },
      { file: "itsonlyright.mp3", title: "It's Only Right", artist: "Kanye West" },
      { file: "holdmeclose.mp3", title: "Hold Me Close", artist: "Kanye West" },
      { file: "fallintoyou.mp3", title: "Fall Into You", artist: "Kanye West" },
      { file: "4444.mp3", title: "4 4 4 4", artist: "Kanye West" },
      { file: "creeptheme.mp3", title: "Creep Theme", artist: "Kanye West" },
      { file: "backupofftheledge.mp3", title: "Back Up Off The Ledge", artist: "Kanye West" },
      { file: "crosses.mp3", title: "Crosses", artist: "Kanye West" },
      { file: "losingme.mp3", title: "Losing Me", artist: "Kanye West" },
      { file: "finesse.mp3", title: "Finesse", artist: "Kanye West, Travis Scott" },
      { file: "gutfeeling.mp3", title: "Gut Feeling", artist: "Kanye West" },
      { file: "rosesandrevolvers.mp3", title: "Roses And Revolvers", artist: "Kanye West" },
      { file: "mysmile.mp3", title: "My Smile", artist: "Kanye West" },
      { file: "dontgetup.mp3", title: "Don't Get Up", artist: "Kanye West, Andrew Wyatt, Marsha Ambrosius, Livvi Franc" },
      { file: "ifeellikethat.mp3", title: "I Feel Like That", artist: "Kanye West, Ty Dolla $ign, The WRLDFMS Tony Williams, Bosco Kante" },
      { file: "blackskinheadremix.mp3", title: "Black Skinhead (Remix)", artist: "Kanye West, Miley Cyrus, Travis Scott" },
  ]
};

// BACK BUTTON
function goBack() {
  window.location.href = "https://peace345.github.io/Ye-Unreleased-Archive/";
}


// VARIABLES
let currentIndex = 0;
let currentVersionIndex = null;


// LOAD ALBUM
document.getElementById("albumTitle").innerText = currentAlbum.name;
document.getElementById("cover").src = currentAlbum.cover;


// BUILD SONG LIST
function buildSongs() {
  const songsDiv = document.getElementById("songs");
  songsDiv.innerHTML = "";

  currentAlbum.songs.forEach((song, i) => {

    // SONG WITH MULTIPLE VERSIONS
    if (song.versions) {

      const group = document.createElement("div");
      group.className = "song";

      group.innerHTML = `<strong>${song.title} ▼</strong>`;

      group.onclick = () => {

        // Prevent duplicates
        if (group.dataset.opened) return;
        group.dataset.opened = true;

        song.versions.forEach((version, versionIndex) => {

          const div = document.createElement("div");
          div.className = "song";

          div.innerHTML = `
            <div style="display:flex; align-items:center;">
              <div style="width:60px;">
                <strong>${version.version}</strong>
              </div>

              <div style="flex:1; text-align:center;">
                <strong>${song.title}</strong><br>
                <small>${version.artist}</small>
              </div>
            </div>
          `;

          div.onclick = (e) => {
            e.stopPropagation();

            currentIndex = i;
            currentVersionIndex = versionIndex;

            window.audio.src = version.file;
            window.audio.play();

            updateMediaSession({
              title: song.title,
              artist: version.artist
            });
          };

          group.after(div);
        });

      };

      songsDiv.appendChild(group);

    }

    // NORMAL SONG
    else {

      const div = document.createElement("div");
      div.className = "song";

      div.innerHTML = `
        <strong>${song.title}</strong><br>
        <small>${song.artist || ""}</small>
      `;

      div.onclick = () => playSong(i);

      songsDiv.appendChild(div);
    }

  });
}


// PLAY SONG
function playSong(i, versionIndex = null) {

  currentIndex = i;

  const song = currentAlbum.songs[i];

  // VERSION GROUP
  if (song.versions) {

    // Start with the LOWEST version.
    // Your array is highest → lowest,
    // so the lowest version is the LAST item.
    if (versionIndex === null) {
      versionIndex = song.versions.length - 1;
    }

    currentVersionIndex = versionIndex;

    const version = song.versions[versionIndex];

    window.audio.src = version.file;
    window.audio.play();

    updateMediaSession({
      title: song.title,
      artist: version.artist
    });

    return;
  }


  // NORMAL SONG
  currentVersionIndex = null;

  window.audio.src = song.file;
  window.audio.play();

  updateMediaSession(song);
}


// MEDIA SESSION
function updateMediaSession(song) {

  if (!("mediaSession" in navigator)) return;

  navigator.mediaSession.metadata = new MediaMetadata({
    title: song.title,
    artist: song.artist,
    album: currentAlbum.name,
    artwork: [
      {
        src: currentAlbum.cover,
        sizes: "512x512",
        type: "image/jpeg"
      }
    ]
  });

  navigator.mediaSession.setActionHandler("play", () => {
    window.audio.play();
  });

  navigator.mediaSession.setActionHandler("pause", () => {
    window.audio.pause();
  });

  navigator.mediaSession.setActionHandler("previoustrack", () => {

    if (!currentAlbum) return;

    // If currently playing a version, go to the previous version
    if (
      currentVersionIndex !== null &&
      currentVersionIndex > 0
    ) {
      playSong(currentIndex, currentVersionIndex - 1);
      return;
    }

    // Otherwise go to previous album track
    if (currentIndex > 0) {
      playSong(currentIndex - 1);
    } else {
      playSong(currentAlbum.songs.length - 1);
    }
  });

  navigator.mediaSession.setActionHandler("nexttrack", () => {

    if (!currentAlbum) return;

    const song = currentAlbum.songs[currentIndex];

    // If playing a version, go to the next version
    if (
      song.versions &&
      currentVersionIndex !== null &&
      currentVersionIndex < song.versions.length - 1
    ) {
      playSong(currentIndex, currentVersionIndex + 1);
      return;
    }

    // Otherwise go to next album track
    if (currentIndex < currentAlbum.songs.length - 1) {
      playSong(currentIndex + 1);
    } else {
      playSong(0);
    }
  });
}


// PLAY / PAUSE BUTTON
function togglePlay() {

  if (window.audio.paused) {
    window.audio.play();
  } else {
    window.audio.pause();
  }
}


// INITIALIZE AUDIO
window.addEventListener("DOMContentLoaded", () => {

  const audio = document.getElementById("audio");

  // Make audio available to the rest of the script
  window.audio = audio;


  // PLAY BUTTON UI
  audio.addEventListener("play", () => {
    document.getElementById("playPauseBtn").innerText = "⏸️ Pause";
  });


  // PAUSE BUTTON UI
  audio.addEventListener("pause", () => {
    document.getElementById("playPauseBtn").innerText = "▶️ Play";
  });


  // AUTOPLAY THROUGH ALBUM
  audio.addEventListener("ended", () => {

    if (!currentAlbum) return;

    const song = currentAlbum.songs[currentIndex];


    // VERSION GROUP
    if (
      song.versions &&
      currentVersionIndex !== null
    ) {

      // Your versions are stored:
      // V6 → V5 → V4 → V1
      //
      // So autoplay moves backward through the array:
      // V1 → V4 → V5 → V6

      const nextVersion = currentVersionIndex - 1;

      if (nextVersion >= 0) {
        playSong(currentIndex, nextVersion);
        return;
      }
    }


    // FINISHED ALL VERSIONS
    // Move to the next album track
    if (currentIndex < currentAlbum.songs.length - 1) {
      playSong(currentIndex + 1);
    } else {
      // End of album → restart album
      playSong(0);
    }

  });


  // BUILD THE SONG LIST
  buildSongs();

});

</script>

</body>
</html>
